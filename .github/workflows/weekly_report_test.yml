name: Weekly Report Live Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  weekly-report-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore Live Bot State
        uses: actions/cache/restore@v4
        with:
          path: |
            ob_state.json
            alert_state.json
            ranking_state.json
          key: weekly-report-test-${{ github.run_id }}
          restore-keys: |
            ict-live-state-${{ github.ref_name }}-

      - name: Initialize Missing State
        run: |
          if [ ! -f alert_state.json ]; then
            echo '{}' > alert_state.json
          fi

          if [ ! -f ob_state.json ]; then
            echo '{}' > ob_state.json
          fi

          if [ ! -f ranking_state.json ]; then
            echo '{}' > ranking_state.json
          fi

      - name: Build Actual Weekly Report
        env:
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
        run: python weekly_report_live.py
