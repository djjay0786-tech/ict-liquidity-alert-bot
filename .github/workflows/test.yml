name: Market Data Test

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run market test
        env:
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
        run: python test_market.py
        
      - name: Run liquidity test
        env:
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
        run: python test_liquidity.py
        
      - name: Run session liquidity test
        env:
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
        run: python test_session.py
        
      - name: Run DXY test
        run: python test_dxy.py
        
      - name: Run DXY liquidity test
        run: python test_dxy_liquidity.py
        
      - name: Run CRT test
        env:
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
        run: python test_crt.py
        
      - name: Run DXY CRT test
        run: python test_dxy_crt.py
        
      - name: Run FVG test
        env:
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
        run: python test_fvg.py
        
      - name: Run Order Block test
        env:
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
        run: python test_order_block.py
        
      - name: Run OB + FVG test
        env:
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
        run: python test_ob_fvg.py
