name: ICT Bot Test

on:
  workflow_dispatch:
    inputs:
      deep_tests:
        description: "Run all deep API tests"
        required: false
        type: boolean
        default: false

jobs:
  test:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt


      # ==========================================
      # RESTORE PERSISTENT BOT STATE
      # ==========================================

      - name: Restore Bot State
        id: restore-state
        uses: actions/cache/restore@v4
        with:
          path: |
            ob_state.json
            alert_state.json
          key: ict-bot-state-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            ict-bot-state-${{ github.ref_name }}-


      # ==========================================
      # CREATE STATE FILES IF FIRST RUN
      # ==========================================

      - name: Initialize State Files
        run: |
          if [ ! -f ob_state.json ]; then
            echo '{}' > ob_state.json
          fi

          if [ ! -f alert_state.json ]; then
            echo '{}' > alert_state.json
          fi


      # ==========================================
      # BASIC MARKET DATA TEST
      # ==========================================

      - name: Run market test
        env:
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
        run: python test_market.py

      - name: Wait for API limit
        run: sleep 15


      # ==========================================
      # LIQUIDITY TEST
      # ==========================================

      - name: Run liquidity test
        env:
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
        run: python test_liquidity.py

      - name: Wait after liquidity test
        run: sleep 15


      # ==========================================
      # SESSION LIQUIDITY TEST
      # ==========================================

      - name: Run session liquidity test
        env:
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
        run: python test_session.py


      # ==========================================
      # DXY TESTS
      # ==========================================

      - name: Run DXY test
        run: python test_dxy.py

      - name: Run DXY liquidity test
        run: python test_dxy_liquidity.py

      - name: Run DXY CRT test
        run: python test_dxy_crt.py


      # ==========================================
      # OB STATE TEST
      #
      # IMPORTANT:
      # Real persistent state is temporarily
      # moved away so this test cannot damage it.
      # ==========================================

      - name: Backup Persistent OB State
        run: |
          cp ob_state.json ob_state.persist.json

      - name: Prepare Clean OB Test State
        run: |
          echo '{}' > ob_state.json

      - name: Run OB State test
        run: python test_ob_state.py

      - name: Restore Persistent OB State
        if: always()
        run: |
          if [ -f ob_state.persist.json ]; then
            mv ob_state.persist.json ob_state.json
          fi


      # ==========================================
      # LIVE ENGINE SAFE IMPORT TEST
      # ==========================================

      - name: Run Live Engine Integration Test
        env:
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python test_live_engine.py


      # ==========================================
      # TELEGRAM TEST
      # ==========================================

      - name: Run Telegram test
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python test_telegram.py


      # ==========================================
      # DEEP TESTS
      # ONLY WHEN deep_tests = true
      # ==========================================

      - name: Wait before deep tests
        if: ${{ inputs.deep_tests }}
        run: sleep 65

      - name: Run CRT deep test
        if: ${{ inputs.deep_tests }}
        env:
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
        run: python test_crt.py

      - name: Wait after CRT
        if: ${{ inputs.deep_tests }}
        run: sleep 65

      - name: Run FVG deep test
        if: ${{ inputs.deep_tests }}
        env:
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
        run: python test_fvg.py

      - name: Wait after FVG
        if: ${{ inputs.deep_tests }}
        run: sleep 65

      - name: Run Order Block deep test
        if: ${{ inputs.deep_tests }}
        env:
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
        run: python test_order_block.py

      - name: Wait after Order Block
        if: ${{ inputs.deep_tests }}
        run: sleep 65

      - name: Run OB + FVG deep test
        if: ${{ inputs.deep_tests }}
        env:
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
        run: python test_ob_fvg.py

      - name: Wait after OB FVG
        if: ${{ inputs.deep_tests }}
        run: sleep 65

      - name: Run OB First Tap deep test
        if: ${{ inputs.deep_tests }}
        env:
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
        run: python test_ob_tap.py

      - name: Wait before MTF test
        if: ${{ inputs.deep_tests }}
        run: sleep 65

      - name: Run Multi-Timeframe OB deep test
        if: ${{ inputs.deep_tests }}
        env:
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
        run: python test_multi_timeframe_ob.py


      # ==========================================
      # SAVE PERSISTENT STATE
      # ==========================================

      - name: Save Bot State
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            ob_state.json
            alert_state.json
          key: ict-bot-state-${{ github.ref_name }}-${{ github.run_id }}
