name: ICT Bot Test

on:
  workflow_dispatch:
    inputs:
      test_mode:
        description: "Select test mode"
        required: true
        default: "basic"
        type: choice
        options:
          - basic
          - liquidity_only
          - session_liquidity_only
          - fvg_only
          - ob_fvg_only
          - confluence_only
          - ranking_only
          - ranking_live
          - ranking_alert_only
          - session_summary_only
          - daily_report_only
          - daily_report_live_only
          - weekly_report_only
          - weekly_report_live_only
          - chart_image_only
          - backtest_only
          - deep

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore Bot State
        uses: actions/cache/restore@v4
        with:
          path: |
            ob_state.json
            alert_state.json
          key: ict-bot-state-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            ict-bot-state-${{ github.ref_name }}-

      - name: Initialize State Files
        run: |
          if [ ! -f ob_state.json ]; then
            echo '{}' > ob_state.json
          fi

          if [ ! -f alert_state.json ]; then
            echo '{}' > alert_state.json
          fi

      - name: Run Basic Test
        if: ${{ inputs.test_mode == 'basic' }}
        run: |
          python -m py_compile \
            market_data.py \
            dxy_data.py \
            liquidity.py \
            session_liquidity.py \
            session_alerts.py \
            session_summary.py \
            daily_report.py \
            daily_report_live.py \
            daily_report_sender.py \
            weekly_report.py \
            weekly_report_live.py \
            weekly_report_sender.py \
            crt.py \
            fvg.py \
            order_block.py \
            ob_fvg.py \
            ob_tap.py \
            ob_state.py \
            alert_state.py \
            telegram_alert.py \
            telegram_chart_alert.py \
            confluence.py \
            ranking.py \
            ranking_alert.py \
            tradingview_link.py \
            chart_image.py \
            backtest_engine.py \
            live_engine.py

          python -c "import live_engine; import backtest_engine; import chart_image; import telegram_chart_alert; print('✅ BASIC IMPORT TEST PASSED')"

      - name: Run Liquidity Only Test
        if: ${{ inputs.test_mode == 'liquidity_only' }}
        run: python test_liquidity_only.py

      - name: Run Session Liquidity Only Test
        if: ${{ inputs.test_mode == 'session_liquidity_only' }}
        run: python test_session_liquidity_only.py

      - name: Run FVG Only Test
        if: ${{ inputs.test_mode == 'fvg_only' }}
        run: python test_fvg_only.py

      - name: Run OB FVG Only Test
        if: ${{ inputs.test_mode == 'ob_fvg_only' }}
        run: python test_ob_fvg_only.py

      - name: Run Confluence Only Test
        if: ${{ inputs.test_mode == 'confluence_only' }}
        run: python test_confluence_only.py

      - name: Run Ranking Only Test
        if: ${{ inputs.test_mode == 'ranking_only' }}
        run: python test_ranking_only.py

      - name: Run Ranking Live Test
        if: ${{ inputs.test_mode == 'ranking_live' }}
        env:
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
        run: python test_ranking_live.py

      - name: Run Ranking Alert Only Test
        if: ${{ inputs.test_mode == 'ranking_alert_only' }}
        run: python test_ranking_alert.py

      - name: Run Session Summary Only Test
        if: ${{ inputs.test_mode == 'session_summary_only' }}
        run: python test_session_summary_only.py

      - name: Run Daily Report Only Test
        if: ${{ inputs.test_mode == 'daily_report_only' }}
        run: python test_daily_report_only.py

      - name: Run Daily Report Live Only Test
        if: ${{ inputs.test_mode == 'daily_report_live_only' }}
        run: python test_daily_report_live_only.py

      - name: Run Weekly Report Only Test
        if: ${{ inputs.test_mode == 'weekly_report_only' }}
        run: python test_weekly_report_only.py

      - name: Run Weekly Report Live Only Test
        if: ${{ inputs.test_mode == 'weekly_report_live_only' }}
        run: python test_weekly_report_live_only.py

      - name: Run Chart Image Only Test
        if: ${{ inputs.test_mode == 'chart_image_only' }}
        run: python test_chart_image.py

      - name: Run Backtest Only Test
        if: ${{ inputs.test_mode == 'backtest_only' }}
        run: python test_backtest_engine.py

      - name: Run Deep Test
        if: ${{ inputs.test_mode == 'deep' }}
        env:
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
        run: |
          python test_market.py
          sleep 8

          python test_liquidity.py
          sleep 8

          python test_session.py
          sleep 8

          python test_crt.py

          python test_liquidity_only.py
          python test_session_liquidity_only.py
          python test_fvg_only.py
          python test_ob_fvg_only.py
          python test_confluence_only.py
          python test_ranking_only.py
          python test_ranking_alert.py
          python test_session_summary_only.py
          python test_daily_report_only.py
          python test_daily_report_live_only.py
          python test_weekly_report_only.py
          python test_weekly_report_live_only.py
          python test_chart_image.py
          python test_backtest_engine.py

          python test_ranking_live.py

          if [ -f test_ob_state.py ]; then
            cp ob_state.json ob_state_backup.json || true
            echo '{}' > ob_state.json

            python test_ob_state.py

            if [ -f ob_state_backup.json ]; then
              mv ob_state_backup.json ob_state.json
            fi
          fi

      - name: Save Bot State
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            ob_state.json
            alert_state.json
          key: ict-bot-state-${{ github.ref_name }}-${{ github.run_id }}
