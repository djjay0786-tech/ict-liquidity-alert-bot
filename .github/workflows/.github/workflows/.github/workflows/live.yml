name: ICT Bot Live Test

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ict-bot-live
  cancel-in-progress: false

jobs:
  live:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore Bot State
        uses: actions/cache/restore@v4
        with:
          path: |
            ob_state.json
            alert_state.json
          key: ict-live-state-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            ict-live-state-${{ github.ref_name }}-

      - name: Initialize State Files
        run: |
          if [ ! -f ob_state.json ]; then
            echo '{}' > ob_state.json
          fi

          if [ ! -f alert_state.json ]; then
            echo '{}' > alert_state.json
          fi

      - name: Run ICT Live Engine
        env:
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python live_engine.py

      - name: Save Bot State
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            ob_state.json
            alert_state.json
          key: ict-live-state-${{ github.ref_name }}-${{ github.run_id }}
