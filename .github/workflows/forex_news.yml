name: Daily Forex News

on:
  workflow_dispatch:

  schedule:
    # 08:00 AM IST = 02:30 UTC
    - cron: "30 2 * * 1-5"

permissions:
  contents: read

jobs:
  forex-news:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Send Daily Forex News
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_GROUP_CHAT_ID: ${{ secrets.TELEGRAM_GROUP_CHAT_ID }}
        run: |
          python -c "from forex_news import format_news_message; from telegram_alert import send_telegram_message; send_telegram_message(format_news_message())"
